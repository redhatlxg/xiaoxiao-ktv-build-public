name: Build private Android source (QA APK) # token setup verification

on:
  workflow_dispatch:
  push:
    branches:
      - main
    paths:
      - ".github/workflows/build-private-android.yml"

permissions:
  contents: read

concurrency:
  group: private-android-qa-build
  cancel-in-progress: true

jobs:
  qa-build:
    runs-on: ubuntu-latest
    timeout-minutes: 45
    steps:
      - name: Verify private source access token
        env:
          SOURCE_REPO_TOKEN: ${{ secrets.SOURCE_REPO_TOKEN }}
        run: |
          if [ -z "$SOURCE_REPO_TOKEN" ]; then
            echo "::error::Missing repository secret SOURCE_REPO_TOKEN. See README.md for setup instructions."
            exit 1
          fi

      - name: Checkout public build workflow
        uses: actions/checkout@v4

      - name: Checkout private KTV source (not published here)
        uses: actions/checkout@v4
        with:
          repository: redhatlxg/xiaoxiao-ktv
          ref: feature/ui-commercial-karaoke-home-187
          token: ${{ secrets.SOURCE_REPO_TOKEN }}
          path: source
          persist-credentials: false

      - name: Set up Java 17
        uses: actions/setup-java@v4
        with:
          distribution: temurin
          java-version: "17"

      - name: Set up Android SDK
        uses: android-actions/setup-android@v3

      - name: Replace production offline-license key with ephemeral QA-only key
        working-directory: source
        shell: bash
        run: |
          python3 - <<'PY'
          import pathlib, re, secrets
          path = pathlib.Path("app/src/main/java/com/local/ktv/ShortLicenseCodec.kt")
          content = path.read_text(encoding="utf-8")
          content, count = re.subn(
              r'(private const val HMAC_KEY_HEX = ")[0-9a-fA-F]{64}(")',
              lambda m: m.group(1) + secrets.token_hex(32) + m.group(2),
              content
          )
          if count != 1:
              raise SystemExit(f"Expected exactly one production key to replace, found {count}")
          path.write_text(content, encoding="utf-8")
          print("Production license key replaced with a one-build QA key.")
          PY

      - name: Build TV QA APK
        working-directory: source
        run: ./gradlew --no-daemon --stacktrace :app:assembleDebug

      - name: Upload TV QA APK
        uses: actions/upload-artifact@v4
        with:
          name: xiaoxiao-ktv-ui-qa-apk
          path: source/app/build/outputs/apk/debug/app-debug.apk
          if-no-files-found: error
          retention-days: 7

# Retry after repository secret was configured.
